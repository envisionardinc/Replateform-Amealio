name: Backend Validation

on:
  push:
    branches:
      - main
      - 'replatform/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, migrate, lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amealio
          POSTGRES_PASSWORD: amealio_dev_pw
          POSTGRES_DB: amealio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amealio -d amealio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://amealio:amealio_dev_pw@localhost:5432/amealio_test?schema=public
      TEST_DATABASE_URL: postgresql://amealio:amealio_dev_pw@localhost:5432/amealio_test?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret
      STAFF_JWT_ACCESS_SECRET: ci-only-staff-access-secret
      RAZORPAY_KEY_ID: rzp_test_ci_key_id
      RAZORPAY_KEY_SECRET: ci-only-razorpay-key-secret
      RAZORPAY_WEBHOOK_SECRET: ci-only-razorpay-webhook-secret
      CONSUMER_AUTH_ENABLED: 'true'
      STAFF_AUTH_ENABLED: 'true'
      PAYMENTS_ENABLED: 'true'
      SETTLEMENT_DELAY_DAYS: '2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Validate database schema
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run full API test suite
        run: npm test --workspace @amealio/api -- --runInBand
